<!DOCTYPE html>
<html lang="fi">

<head>
  {% include '_site_head.html' %}
  <title>Vaihda salasana — Venevaraus</title>
</head>

<body class="site-body">
  <div class="site-shell site-shell--narrow">
    <div class="site-card">
      <a class="site-back" href="{{ url_for('profile') }}">← Oma profiili</a>

      <header class="site-page-header site-page-header--tight">
        <h1>Vaihda salasana</h1>
        <p class="site-tagline">Syötä nykyinen salasana ja uusi salasana kahdesti.</p>
      </header>

      <form class="ajax-form site-form" action="{{ url_for('change_password') }}" method="post">
        {% include '_csrf_field.html' %}
        <div class="site-field">
          <label for="pwd-current">Nykyinen salasana</label>
          <input id="pwd-current" type="password" name="current_password" autocomplete="current-password" required />
        </div>
        <div class="site-field">
          <label for="pwd-new1">Uusi salasana</label>
          <input id="pwd-new1" type="password" name="password1" autocomplete="new-password" required />
        </div>
        <div class="site-field">
          <label for="pwd-new2">Uusi salasana uudestaan</label>
          <input id="pwd-new2" type="password" name="password2" autocomplete="new-password" required />
        </div>
        <div class="site-form-actions">
          <input class="btn btn-primary" type="submit" value="Tallenna uusi salasana" />
        </div>
      </form>
      <script src="{{ url_for('static', filename='ajax_forms.js') }}"></script>
    </div>
  </div>
</body>

</html>
