<!DOCTYPE html>
<html lang="fi">

<head>
  {% include '_site_head.html' %}
  <title>Rekisteröityminen</title>
</head>

<body class="site-body">
  <div class="site-shell site-shell--narrow">
    <div class="site-card">
      <a class="site-back" href="/">← Etusivu</a>

      <header class="site-page-header site-page-header--tight">
        <h1>Luo tunnus</h1>
      </header>

      <form class="ajax-form site-form" action="/create" method="post">
        {% include '_csrf_field.html' %}
        <div class="site-field">
          <label for="reg-username">Käyttäjätunnus</label>
          <input id="reg-username" type="text" name="username" autocomplete="username" />
        </div>
        <div class="site-field">
          <label for="reg-pw1">Salasana</label>
          <input id="reg-pw1" type="password" name="password1" autocomplete="new-password" required />
        </div>
        <div class="site-field">
          <label for="reg-pw2">Salasana uudestaan</label>
          <input id="reg-pw2" type="password" name="password2" autocomplete="new-password" required />
        </div>
        <div class="site-form-actions">
          <input class="btn btn-primary" type="submit" value="Luo tunnus" />
        </div>
      </form>
      <script src="{{ url_for('static', filename='ajax_forms.js') }}"></script>
    </div>
  </div>
</body>

</html>
