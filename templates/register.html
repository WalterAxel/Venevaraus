<!DOCTYPE html>
<html>

<head>
  <title>Register</title>
</head>

<body>
  <p><a href="/">← Home</a></p>

  <form class="ajax-form" action="/create" method="post">
    {% include '_csrf_field.html' %}
    <p>
      Username: <br />
      <input type="text" name="username" />
    </p>
    <p>
      Password: <br />
      <input type="password" name="password1" />
    </p>
    <p>
      Password again: <br />
      <input type="password" name="password2" />
    </p>
    <input type="submit" value="Create account" />
  </form>
  <script src="{{ url_for('static', filename='ajax_forms.js') }}"></script>
</body>

</html>
