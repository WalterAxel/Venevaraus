<!DOCTYPE html>
<html>

<head>
  <title>Reservations — {{ date_label }}</title>
</head>

<body>
  <p><a href="/">← Home</a></p>

  <h1>Reservations for {{ date_label }}</h1>

  {% if not reservations %}
  <p>No reservations for this day.</p>
  {% else %}
  <ul>
    {% for r in reservations %}
    <li>
      <a href="/reservation/{{ r.id }}">{{ r.title }}</a>
      — {{ category_label(r.category) }} — {{ r.username }}
      ({{ r.start }} … {{ r.end }})
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</body>

</html>
