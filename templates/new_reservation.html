<!DOCTYPE html>
<html>

<head>
  <title>New entry</title>
</head>

<body>
  <p><a href="/">← Home</a></p>

  <h1>New entry</h1>

  {% set calendar_pick_dates = true %}
  {% include 'calendar.html' %}

  <form class="ajax-form" action="/create_reservation" method="post">
    {% include '_csrf_field.html' %}
    <p>
      Type: <br />
      <label><input type="radio" name="category" value="booking" checked /> Booking</label>
      <label><input type="radio" name="category" value="fault_report" /> Fault report</label>
    </p>
    <p>
      Title: <br />
      <input type="text" name="title" />
    </p>
    <p>
      Description: <br />
	  <textarea name="description" rows="8" cols="60"></textarea>
    </p>
	<p>
	  Start: <br />
	  <input type="datetime-local" id="start" name="reservation_start" />
	</p>
    <p>
	  End: <br />
	  <input type="datetime-local" id="end" name="reservation_end" />
	</p>

    <input type="submit" value="Save entry" />
  </form>
  <script src="{{ url_for('static', filename='ajax_forms.js') }}"></script>
</body>

</html>
